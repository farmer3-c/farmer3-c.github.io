# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 主题用 tar 包下载，不拉 submodule——
      # 避免 checkout 浅克隆时因子模块钉在旧 commit 上而卡死/超时。
      # 本地开发仍走 submodule（themes/PaperMod），互不影响。
      - name: Fetch PaperMod theme
        run: |
          curl -fsSL -o /tmp/papermod.tar.gz \
            https://github.com/adityatelange/hugo-PaperMod/archive/d3768854d00ad003b0a8dbdba254ce9224377a01.tar.gz
          mkdir -p themes/PaperMod
          tar -xzf /tmp/papermod.tar.gz -C themes/PaperMod --strip-components=1
          rm -rf themes/PaperMod/.git
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
